name: Deploy Node.js Server

on:
  push:
    branches:
      - deploy

concurrency:
  group: met-club-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 24

            cd ~/Met_Club/backend

            git fetch origin deploy
            git checkout deploy
            git pull --ff-only origin deploy

            npm ci --include=dev
            npm run build
            test -s api/server.js

            npx --no-install prisma migrate deploy

            if pm2 describe "met-club-server:5000" > /dev/null 2>&1; then
              pm2 restart "met-club-server:5000" --update-env
            else
              pm2 start api/server.js --name "met-club-server:5000"
            fi

            pm2 save
